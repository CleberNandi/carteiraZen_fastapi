services:
  db:
    image: postgres:15-alpine
    container_name: ci_db
    environment:
      POSTGRES_USER: ${ZNY_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ZNY_POSTGRES_PASSWORD}
      POSTGRES_DB: ${ZNY_POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${ZNY_POSTGRES_USER} -d $${ZNY_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    container_name: ci_api
    environment:
      - DATABASE_URL=postgresql://${ZNY_POSTGRES_USER}:${ZNY_POSTGRES_PASSWORD}@db:5432/${ZNY_POSTGRES_DB}
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./:/app

volumes:
  pgdata:
