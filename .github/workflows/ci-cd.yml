name: CI/CD Zenny

on:
  push:
    branches:
      - "feature/**"
      - "dev"
      - "hml"
      - "main"
  pull_request:
    branches:
      - "dev"
      - "hml"
      - "main"
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Verify Docker & Compose
        run: docker --version && docker compose version

      - name: Create temp env file
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
        run: |
          set -e
          for var in SMTP_USER SMTP_PASSWORD SECRET_KEY NGROK_AUTHTOKEN POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB DOCKER_USERNAME DOCKER_PASSWORD DATABASE_URL; do
            if [ -z "${!var}" ]; then
              echo "Error: $var is not set!"
              exit 1
            fi
          done

          echo "POSTGRES_USER=$POSTGRES_USER" > .env.ci
          echo "POSTGRES_PASSWORD=$POSTGRES_PASSWORD" >> .env.ci
          echo "POSTGRES_DB=$POSTGRES_DB" >> .env.ci
          echo "DATABASE_URL=$DATABASE_URL" >> .env.ci
          echo "SMTP_USER=$SMTP_USER" >> .env.ci
          echo "SMTP_PASSWORD=$SMTP_PASSWORD" >> .env.ci
          echo "SECRET_KEY=$SECRET_KEY" >> .env.ci
          echo "NGROK_AUTHTOKEN=$NGROK_AUTHTOKEN" >> .env.ci
          echo "DOCKER_USERNAME=$DOCKER_USERNAME" >> .env.ci
          echo "DOCKER_PASSWORD=$DOCKER_PASSWORD" >> .env.ci

      - name: Print .env.ci for debugging
        run: cat .env.ci

      - name: Run tests with docker compose
        run: |
          set -e
          docker compose --env-file .env.ci -f docker-compose.ci.yml up -d --build

          # roda pytest dentro do container da API
          docker compose exec -T api pytest -v

      - name: Tear down docker-compose
        if: always()
        run: |
          docker compose --env-file .env.ci -f docker-compose.ci.yml down -v --remove-orphans
