name: CI/CD Zenny

on:
  push:
    branches:
      - "feature/**"
      - "dev"
      - "hml"
      - "main"
  pull_request:
    branches:
      - "dev"
      - "hml"
      - "main"
  workflow_dispatch: # permite executar manualmente no GitHub.

jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: ${{ secrets.ZNY_POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.ZNY_POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.ZNY_POSTGRES_DB }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Verify Docker & Compose
        run: docker --version && docker compose version

      - name: Run tests with docker compose
        env:
          ZNY_POSTGRES_USER: ${{ secrets.ZNY_POSTGRES_USER }}
          ZNY_POSTGRES_PASSWORD: ${{ secrets.ZNY_POSTGRES_PASSWORD }}
          ZNY_POSTGRES_DB: ${{ secrets.ZNY_POSTGRES_DB }}
        run: docker compose -f docker-compose.ci.yml up --build --abort-on-container-exit --exit-code-from api
  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set Docker image tag
        id: tag
        run: |
          BRANCH_NAME=$(echo "${GITHUB_REF##*/}" | tr '/' '-')
          if [[ "$BRANCH_NAME" == "main" ]]; then
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          elif [[ "$BRANCH_NAME" == "dev" ]]; then
            echo "IMAGE_TAG=dev" >> $GITHUB_ENV
          elif [[ "$BRANCH_NAME" == "hml" ]]; then
            echo "IMAGE_TAG=hml" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=feature-${BRANCH_NAME}" >> $GITHUB_ENV
          fi

      - name: Build Docker image
        run: |
          docker build -t clebernandi/carteira-zen-backend:${{ env.IMAGE_TAG }} --target final .

      - name: Push Docker image
        run: |
          docker push clebernandi/carteira-zen-backend:${{ env.IMAGE_TAG }}
