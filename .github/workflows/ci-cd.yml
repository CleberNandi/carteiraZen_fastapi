name: CI/CD Zenny

on:
  push:
    branches:
      - "feature/**"
      - "dev"
      - "hml"
      - "main"
  pull_request:
    branches:
      - "dev"
      - "hml"
      - "main"
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Verify Docker & Compose
        run: docker --version && docker compose version

      - name: Validate GitHub Secrets & Create .env.ci
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: |
          set -e
          # Validação de todas as variáveis obrigatórias
          for var in POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB DATABASE_URL NGROK_AUTHTOKEN DOCKER_USERNAME DOCKER_PASSWORD SECRET_KEY SMTP_USER SMTP_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "Error: $var is not set!"
              exit 1
            fi
          done

          # Criação do .env.ci
          cat <<EOF > .env.ci
          POSTGRES_USER=$POSTGRES_USER
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          POSTGRES_DB=$POSTGRES_DB
          DATABASE_URL=$DATABASE_URL
          NGROK_AUTHTOKEN=$NGROK_AUTHTOKEN
          DOCKER_USERNAME=$DOCKER_USERNAME
          DOCKER_PASSWORD=$DOCKER_PASSWORD
          SECRET_KEY=$SECRET_KEY
          SMTP_USER=$SMTP_USER
          SMTP_PASSWORD=$SMTP_PASSWORD
          EOF

      - name: Print .env.ci for debugging
        run: cat .env.ci

      - name: Build and start Docker Compose
        run: |
          set -e
          docker compose --env-file .env.ci -f docker-compose.ci.yml up -d --build

      - name: Wait for DB to be healthy
        run: |
          set -e
          echo "Aguardando DB ficar saudável..."
          docker compose --env-file .env.ci -f docker-compose.ci.yml ps
          # Loop para aguardar até 60s, mas termina assim que DB estiver healthy
          for i in $(seq 1 12); do
            STATUS=$(docker inspect -f '{{.State.Health.Status}}' ci_db)
            if [ "$STATUS" = "healthy" ]; then
              echo "DB está saudável!"
              break
            fi
            echo "DB não pronto ainda... esperando 5s"
            sleep 5
          done

      - name: Show Ngrok URL
        if: ${{ secrets.NGROK_AUTHTOKEN != '' }}
        run: |
          echo "Ngrok container logs:"
          docker compose logs ngrok | grep -o 'https://[0-9a-z]*\.ngrok.io'

      - name: Tear down docker-compose
        if: always()
        run: |
          docker compose --env-file .env.ci -f docker-compose.ci.yml down -v --remove-orphans
