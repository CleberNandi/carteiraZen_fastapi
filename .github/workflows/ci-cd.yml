name: CI/CD Zenny

on:
  push:
    branches:
      - "feature/**"
      - "dev"
      - "hml"
      - "main"
  pull_request:
    branches:
      - "dev"
      - "hml"
      - "main"
  workflow_dispatch: # permite executar manualmente no GitHub.

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ${{ secrets.ZNY_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.ZNY_POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.ZNY_POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ${{ secrets.ZNY_POSTGRES_USER }} -d ${{ secrets.ZNY_POSTGRES_DB }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Build Docker Compose services
        run: docker-compose build --parallel

      - name: Run tests
        run: docker-compose run --rm api pytest --cov=app tests/

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set Docker image tag
        id: tag
        run: |
          BRANCH_NAME=$(echo "${GITHUB_REF##*/}" | tr '/' '-')
          if [[ "$BRANCH_NAME" == "main" ]]; then
            echo "IMAGE_TAG=latest" >> $GITHUB_ENV
          elif [[ "$BRANCH_NAME" == "dev" ]]; then
            echo "IMAGE_TAG=dev" >> $GITHUB_ENV
          elif [[ "$BRANCH_NAME" == "hml" ]]; then
            echo "IMAGE_TAG=hml" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=feature-${BRANCH_NAME}" >> $GITHUB_ENV
          fi

      - name: Build Docker image
        run: |
          docker build -t clebernandi/carteira-zen-backend:${{ env.IMAGE_TAG }} --target final .

      - name: Push Docker image
        run: |
          docker push clebernandi/carteira-zen-backend:${{ env.IMAGE_TAG }}
