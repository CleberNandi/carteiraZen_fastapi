name: CI/CD Zenny

on:
  push:
    branches:
      - "feature/**"
      - "dev"
      - "hml"
      - "main"
  pull_request:
    branches:
      - "dev"
      - "hml"
      - "main"
  workflow_dispatch:

# Permissões necessárias para criar PRs automaticamente
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Verify Docker & Compose
        run: docker --version && docker compose version

      - name: Validate GitHub Secrets & Create .env.ci
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          ALGORITHM: ${{ secrets.ALGORITHM }}
          PASSWORD_SYSTEM: ${{ secrets.PASSWORD_SYSTEM }}
        run: |
          set -e

          # Validação das variáveis obrigatórias
          for var in POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB DOCKER_USERNAME DOCKER_PASSWORD SECRET_KEY SMTP_USER SMTP_PASSWORD SMTP_SERVER SMTP_PORT; do
            if [ -z "${!var}" ]; then
              echo "Error: $var is not set!"
              exit 1
            fi
          done

          # Criação do .env.ci com TODAS as configurações necessárias
          cat <<EOF > .env.ci
          # Database
          POSTGRES_USER=$POSTGRES_USER
          POSTGRES_PASSWORD=$POSTGRES_PASSWORD
          POSTGRES_DB=$POSTGRES_DB
          POSTGRES_HOST=$POSTGRES_HOST

          # Docker
          DOCKER_USERNAME=$DOCKER_USERNAME
          DOCKER_PASSWORD=$DOCKER_PASSWORD

          # Security & Auth
          SECRET_KEY=$SECRET_KEY
          ALGORITHM=${ALGORITHM:-HS256}
          PASSWORD_SYSTEM=${PASSWORD_SYSTEM:-}

          # Email/SMTP
          SMTP_USER=$SMTP_USER
          SMTP_PASSWORD=$SMTP_PASSWORD
          SMTP_SERVER=$SMTP_SERVER
          SMTP_PORT=$SMTP_PORT
          SMTP_TLS=true
          SMTP_SSL=false

          # Ngrok (opcional)
          NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}

          # Environment
          ENVIRONMENT=testing
          DEBUG=false
          TESTING=true
          EOF

      - name: Print .env.ci for debugging (sem senhas)
        run: |
          echo "=== Configurações do .env.ci (sem senhas) ==="
          sed 's/PASSWORD=.*/PASSWORD=***/' .env.ci | sed 's/SECRET_KEY=.*/SECRET_KEY=***/' | sed 's/AUTHTOKEN=.*/AUTHTOKEN=***/'

      - name: Build and start services (DB + Ngrok)
        run: |
          set -e
          docker compose --env-file .env.ci -f docker-compose.ci.yml up -d db ngrok

      - name: Wait for DB to be healthy
        run: |
          set -e
          echo "Aguardando DB ficar saudável..."
          for i in $(seq 1 12); do
            STATUS=$(docker inspect -f '{{.State.Health.Status}}' ci_db)
            if [ "$STATUS" = "healthy" ]; then
              echo "DB está saudável!"
              break
            fi
            echo "DB não pronto ainda... esperando 5s (tentativa $i/12)"
            sleep 5
          done

          # Verifica se DB está realmente saudável
          if [ "$(docker inspect -f '{{.State.Health.Status}}' ci_db)" != "healthy" ]; then
            echo "❌ DB não ficou saudável após 60 segundos"
            docker logs ci_db
            exit 1
          fi

      - name: Run Alembic migrations (CI)
        run: |
          set -e
          echo "🔹 Rodando migrations Alembic na base de CI..."

          # Debug: Verificar estado do container antes de executar Alembic
          echo "🔍 Debugando ambiente do container..."
          docker compose --env-file .env.ci -f docker-compose.ci.yml run --rm api python -c "
          import sys, os
          print('🐍 Python:', sys.version)
          print('📁 CWD:', os.getcwd())
          print('🛤️  Python Path:', sys.path[:3], '...')
          print('📂 Conteúdo:', [f for f in os.listdir('.') if not f.startswith('.')][:10])
          if os.path.exists('.venv'): print('✅ .venv existe')
          else: print('❌ .venv não existe')
          try:
              import dynaconf
              print('✅ dynaconf importado com sucesso')
          except ImportError as e:
              print(f'❌ dynaconf: {e}')
          "

          # Verificar se o container tem ambiente virtual
          VENV_EXISTS=$(docker compose --env-file .env.ci -f docker-compose.ci.yml run --rm api bash -c "if [ -d .venv ]; then echo 'true'; else echo 'false'; fi")

          if [ "$VENV_EXISTS" = "true" ]; then
            echo "📦 Usando ambiente virtual (.venv) para Alembic..."
            docker compose --env-file .env.ci -f docker-compose.ci.yml run --rm api .venv/bin/alembic upgrade head
          else
            echo "📦 Usando uv run para Alembic..."
            docker compose --env-file .env.ci -f docker-compose.ci.yml run --rm api uv run alembic upgrade head
          fi

      - name: Build API container
        run: |
          set -e
          docker compose --env-file .env.ci -f docker-compose.ci.yml build api

      - name: Run tests
        run: |
          set -e
          echo "🧪 Executando testes..."
          docker compose --env-file .env.ci -f docker-compose.ci.yml run --rm api

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== 🔍 API Container Logs ==="
          docker compose --env-file .env.ci -f docker-compose.ci.yml logs api || true
          echo "=== 🔍 DB Container Logs ==="
          docker compose --env-file .env.ci -f docker-compose.ci.yml logs db || true
          echo "=== 🔍 Ngrok Container Logs ==="
          docker compose --env-file .env.ci -f docker-compose.ci.yml logs ngrok || true

      - name: Show Ngrok URL
        env:
          NGROK_AUTHTOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
        run: |
          if [ -n "$NGROK_AUTHTOKEN" ]; then
            echo "🌐 Procurando URL do Ngrok..."
            docker compose --env-file .env.ci -f docker-compose.ci.yml logs ngrok | grep -o 'https://[0-9a-z]*\.ngrok-free\.app' || \
            docker compose --env-file .env.ci -f docker-compose.ci.yml logs ngrok | grep -o 'https://[0-9a-z]*\.ngrok\.io' || \
            echo "ℹ️  URL do Ngrok não encontrada nos logs"
          else
            echo "ℹ️  NGROK_AUTHTOKEN não configurado, pulando exibição da URL"
          fi

      - name: Tear down docker-compose
        if: always()
        run: |
          echo "🧹 Limpando containers..."
          docker compose --env-file .env.ci -f docker-compose.ci.yml down -v --remove-orphans

  # Job para criar PR automática de feature branches para dev
  create-pr:
    runs-on: ubuntu-latest
    needs: build-test
    if: success() && startsWith(github.ref, 'refs/heads/feature/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Extract feature branch info
        shell: bash
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          FEATURE_NAME=${BRANCH_NAME#feature/}
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
          echo "FEATURE_NAME=$FEATURE_NAME" >> $GITHUB_ENV
          echo "🌿 Feature Branch: $BRANCH_NAME"
          echo "📝 Feature Name: $FEATURE_NAME"

      - name: Check if PR already exists
        id: check-pr
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${{ env.BRANCH_NAME }}`,
              base: 'dev',
              state: 'open'
            });

            if (pulls.length > 0) {
              core.setOutput('exists', 'true');
              core.setOutput('pr-number', pulls[0].number);
              core.setOutput('pr-url', pulls[0].html_url);
              console.log(`PR já existe: #${pulls[0].number}`);
            } else {
              core.setOutput('exists', 'false');
              console.log('Nenhuma PR encontrada, pode criar nova');
            }

      - name: Create Pull Request
        if: steps.check-pr.outputs.exists == 'false'
        uses: repo-sync/pull-request@v2
        with:
          source_branch: ${{ env.BRANCH_NAME }}
          destination_branch: "dev"
          pr_title: "✨ Feature: ${{ env.FEATURE_NAME }}"
          pr_body: |
            ## 🚀 Auto PR - Feature Branch

            **Branch**: `${{ env.BRANCH_NAME }}`
            **Testes**: ✅ Passaram com sucesso
            **Workflow**: #${{ github.run_number }}

            ### 📋 Checklist
            - [x] Testes executados automaticamente
            - [ ] Code review necessário
            - [ ] Documentação atualizada (se necessário)

            ---
            *Esta PR foi criada automaticamente após os testes passarem no branch feature.*

            **Commit**: ${{ github.sha }}
            **Author**: @${{ github.actor }}
          github_token: ${{ secrets.PAT }}
      - name: PR Success Summary
        if: steps.check-pr.outputs.exists == 'false'
        run: |
          echo "✅ PR criada com sucesso!"
          echo "🌿 Feature: ${{ env.FEATURE_NAME }}"
          echo "📝 Branch: ${{ env.BRANCH_NAME }}"

          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## 🎉 PR Criada Automaticamente

          - 🌿 **Feature**: ${{ env.FEATURE_NAME }}
          - 📝 **Branch**: ${{ env.BRANCH_NAME }}
          - ✅ **Testes**: Passaram
          - 👤 **Author**: @${{ github.actor }}
          - 🔧 **Workflow**: #${{ github.run_number }}
          EOF

      - name: PR already exists notification
        if: steps.check-pr.outputs.exists == 'true'
        run: |
          echo "ℹ️  PR já existe para este branch"
          echo "🔗 PR existente: ${{ steps.check-pr.outputs.pr-url }}"
          echo "📝 Número da PR: #${{ steps.check-pr.outputs.pr-number }}"

          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## ℹ️  PR já existe

          - 🌿 **Branch**: ${{ env.BRANCH_NAME }}
          - 🔗 **PR existente**: [#${{ steps.check-pr.outputs.pr-number }}](${{ steps.check-pr.outputs.pr-url }})
          - ✅ **Testes**: Passaram novamente
          EOF

  # Job de deploy - só executa se os testes passaram
  deploy:
    runs-on: ubuntu-latest
    needs: build-test
    if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/hml' || github.ref == 'refs/heads/dev')
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Extract branch name
        shell: bash
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          echo "BRANCH_NAME=$BRANCH" >> $GITHUB_ENV
          echo "🌿 Branch: $BRANCH"

      - name: Run Alembic migrations (Prod/Staging)
        if: github.ref == 'refs/heads/main'
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          ENV_MODE: prod
        run: |
          set -e
          echo "🔹 Rodando migrations Alembic no banco PROD/STAGING..."
          python -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt
          alembic upgrade head

      - name: Generate Docker tags
        id: meta
        run: |
          DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}"
          REPO_NAME="carteirazen"

          case "${{ env.BRANCH_NAME }}" in
            main)
              TAGS="$DOCKER_USERNAME/$REPO_NAME:latest,$DOCKER_USERNAME/$REPO_NAME:v${{ github.run_number }}"
              ;;
            hml)
              TAGS="$DOCKER_USERNAME/$REPO_NAME:hml,$DOCKER_USERNAME/$REPO_NAME:hml-v${{ github.run_number }}"
              ;;
            dev)
              TAGS="$DOCKER_USERNAME/$REPO_NAME:dev,$DOCKER_USERNAME/$REPO_NAME:dev-v${{ github.run_number }}"
              ;;
            *)
              TAGS="$DOCKER_USERNAME/$REPO_NAME:${{ env.BRANCH_NAME }}"
              ;;
          esac

          echo "DOCKER_TAGS=$TAGS" >> $GITHUB_ENV
          echo "🏷️  Tags geradas: $TAGS"

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.DOCKER_TAGS }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDKIT_INLINE_CACHE=1

      - name: Docker Hub deployment summary
        run: |
          echo "🚀 **Deployment Summary**" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Testes executados com sucesso" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Imagem Docker construída e enviada" >> $GITHUB_STEP_SUMMARY
          echo "- 🌿 **Branch**: ${{ env.BRANCH_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- 🏷️  **Tags**: ${{ env.DOCKER_TAGS }}" >> $GITHUB_STEP_SUMMARY
          echo "- 🐳 **Docker Hub**: https://hub.docker.com/r/${{ secrets.DOCKER_USERNAME }}/carteirazen" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 **Run #**: ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY

      - name: Success notification
        run: |
          echo "🎉 Deploy realizado com sucesso!"
          echo "📦 Imagem disponível em: ${{ secrets.DOCKER_USERNAME }}/carteirazen"
          echo "🏷️  Tags criadas: ${{ env.DOCKER_TAGS }}"
